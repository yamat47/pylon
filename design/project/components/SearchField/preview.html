<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SearchField</title>
<style>#root { display: grid; gap: var(--space-12); padding: var(--space-6); } #root > div { min-width: 0; }</style>
</head>
<body>
<div id="root"></div>
<script>
document.documentElement.lang = "ja";
var P = window.Pylon, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(
  h(React.Fragment, null,
    h("div", null, h(P.SearchField, { "id": "search-input", "name": "q", "label": "検索する言葉", "placeholder": "記事を検索" }))
  )
);
</script>
</body>
</html>
