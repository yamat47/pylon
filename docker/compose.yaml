name: pylon

x-base: &base
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: pylon-dev
  volumes:
    - ..:/workspace
    # node_modules is not shared with the host. The native binaries of Biome and esbuild differ
    # between darwin and linux, and heavy file I/O across a bind mount is slow
    - node_modules:/workspace/node_modules
    - pnpm-store:/home/node/.local/share/pnpm/store

services:
  # Runs Makefile tasks (docker compose run --rm)
  workspace:
    <<: *base

  # Storybook, where the components are looked at (make storybook / make down)
  storybook:
    <<: *base
    command: pnpm run storybook
    ports:
      # Only this machine's browser may reach it
      - "127.0.0.1:6006:6006"
    environment:
      # In some environments (such as colima's default), edits on the host do not reach the container
      # via inotify, so pick them up by polling. The chokidar bundled with Vite reads this variable
      CHOKIDAR_USEPOLLING: "true"
    # Passes once Storybook answers. make storybook is docker compose up --wait, which waits for this.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6006/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      start_period: 120s
      start_interval: 1s

volumes:
  node_modules:
  pnpm-store:
