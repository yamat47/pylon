<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PageHeader</title>
<style>#root { display: grid; gap: var(--space-12); padding: var(--space-6); } #root > div { min-width: 0; }</style>
</head>
<body>
<div id="root"></div>
<script>
document.documentElement.lang = "ja";
var P = window.Pylon, h = React.createElement;
ReactDOM.createRoot(document.getElementById("root")).render(
  h(React.Fragment, null,
    h("div", null, h(P.PageHeader, { "title": "開発のストーリー分割・タスク分割をするときに考えていること", "date": "2025-02-13" })),
    h("div", null, h(P.PageHeader, { "title": "プライバシーポリシー" })),
    h("div", null, h(P.PageHeader, { "title": "プロジェクト", "count": 8 }))
  )
);
</script>
</body>
</html>
