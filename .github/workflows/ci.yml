name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel the running older run when a new push arrives on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Steps are added to this one job as the repository grows, so that its name can be a required
  # check (declared in yamat47/infra-github) and never has to change.
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned by SHA as a rule, but github-toolkit is the one exception and tracks @main directly.
      # The author maintains that repository, and pinning upstream actions by SHA and updating them with
      # Dependabot happen on the toolkit side.
      - name: Checkout
        uses: yamat47/github-toolkit/actions/checkout@main
        with:
          persist-credentials: false

      - name: Setup Node.js with pnpm and install dependencies
        # The pnpm version is read from packageManager in package.json, and Node from .node-version.
        uses: yamat47/github-toolkit/actions/setup-node-with-pnpm@main
        with:
          node-version-file: .node-version

      - name: Typecheck (tsc)
        run: pnpm run typecheck

      - name: Lint (Biome)
        run: pnpm run lint

      # One of the tests fails when src/tokens.css, which is generated and committed, is not what
      # the tokens generate.
      - name: Test (node --test)
        run: pnpm run test

      # No story is rendered here: the build only shows that every component and story compiles.
      - name: Build Storybook
        run: pnpm run storybook:build

  # Checks how the workflows are written. zizmor finds missing permissions, script injection,
  # actions not pinned by SHA, and so on.
  lint-workflows:
    name: lint workflows (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: yamat47/github-toolkit/actions/checkout@main
        with:
          persist-credentials: false

      - name: zizmor
        uses: yamat47/github-toolkit/actions/zizmor@main
        with:
          advanced-security: "false"
          annotations: "true"
